name: Daily GitHub Activity Bot

on:
  schedule:
    - cron: '0 2 * * *'   # Runs every day at 2:00 AM UTC (7:30 AM IST)
  workflow_dispatch:

jobs:
  commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Make daily commit
        run: |
          echo "Daily update: $(date '+%Y-%m-%d %H:%M:%S')" >> daily_log.txt
          git add daily_log.txt
          git commit -m "chore: daily update $(date '+%Y-%m-%d')"
          git push
